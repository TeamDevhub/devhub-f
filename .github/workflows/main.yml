name: Frontend CI/CD

on:
  push:
    branches:
      - dev

env:
  PROJECT: devhub-f
  TARGET_ENV: dev

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Generate Build Tag
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)

          BUILD_TAG="${PROJECT}-${DATE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "BUILD_TAG=${BUILD_TAG,,}" >> $GITHUB_ENV

      - name: Set Image Name
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT}-${TARGET_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            --build-arg VITE_FILE_API_URL=/files \
            -t ${IMAGE_NAME}:${BUILD_TAG} \
            -t ${IMAGE_NAME}:latest \
            .

      - name: Docker Push
        run: |
          docker push ${IMAGE_NAME}:${BUILD_TAG}
          docker push ${IMAGE_NAME}:latest

      - name: Checkout Infra Repository
        uses: actions/checkout@v4
        with:
          repository: TeamDevhub/devhub-infra
          token: ${{ secrets.GH_PAT }}
          ref: dev
          path: infra

      - name: Verify Deployment File
        run: |
          test -f infra/k8s/dev/devhub-f/deployment.yml

      - name: Update Deployment Image
        run: |
          DEPLOY_FILE="infra/k8s/dev/devhub-f/deployment.yml"

          sed -i \
            "s#image: .*#image: ${IMAGE_NAME}:${BUILD_TAG}#g" \
            ${DEPLOY_FILE}

          echo "Updated deployment.yml"
          grep image: ${DEPLOY_FILE}

      - name: Commit And Push Infra Changes
        run: |

          cd infra

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/dev/devhub-f/deployment.yml

          git commit \
            -m "[CI] Update frontend image to ${BUILD_TAG}" \
            || echo "No changes"

          git push origin dev

      - name: Print Result
        run: |
          echo "================================="
          echo "Frontend Build Success"
          echo "Image : ${IMAGE_NAME}:${BUILD_TAG}"
          echo "================================="
